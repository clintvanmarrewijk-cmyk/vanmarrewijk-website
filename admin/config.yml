backend:
  name: git-gateway
  branch: main

media_folder: "site_images"
public_folder: "/site_images"

collections:
  - name: "writing"
    label: "Writing & Media"
    folder: "writing"
    create: true
    extension: "html"
    format: "html"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Body", name: "body", widget: "code", default_language: "html", output_code_only: true }

  - name: "pages"
    label: "Site Pages"
    files:
      - label: "Home Page"
        name: "home"
        file: "index.html"
        fields:
          - { label: "Body", name: "body", widget: "code", default_language: "html", output_code_only: true }
